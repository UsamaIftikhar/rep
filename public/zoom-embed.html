<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoom Strategy Session</title>

  <!-- Zoom Meeting SDK Stylesheets (Required for Component View UI rendering) -->
  <link type="text/css" rel="stylesheet" href="https://source.zoom.us/3.11.0/css/bootstrap.css" />
  <link type="text/css" rel="stylesheet" href="https://source.zoom.us/3.11.0/css/react-select.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body, #zoom-meeting-root {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }
    #status-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #070707;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      text-align: center;
      padding: 24px;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #F21717;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .status-sub {
      font-size: 12px;
      color: #A3A3A3;
      max-width: 420px;
      line-height: 1.5;
      margin: 0 auto;
    }
    .btn-action {
      padding: 8px 16px;
      background-color: #F21717;
      color: #ffffff;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn-action:hover {
      background-color: #d90f0f;
    }
    .btn-secondary {
      background-color: #1a1a1a;
      border-color: rgba(255, 255, 255, 0.15);
      color: #e5e5e5;
    }
    .btn-secondary:hover {
      background-color: #262626;
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
    }
    .action-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }
  </style>

  <!-- Zoom Meeting SDK Vendor Dependencies (Version 3.11.0) -->
  <script src="https://source.zoom.us/3.11.0/lib/vendor/react.min.js"></script>
  <script src="https://source.zoom.us/3.11.0/lib/vendor/react-dom.min.js"></script>
  <script src="https://source.zoom.us/3.11.0/lib/vendor/redux.min.js"></script>
  <script src="https://source.zoom.us/3.11.0/lib/vendor/redux-thunk.min.js"></script>
  <script src="https://source.zoom.us/3.11.0/lib/vendor/lodash.min.js"></script>

  <!-- Zoom Meeting SDK Embedded Component View (Version 3.11.0) -->
  <script src="https://source.zoom.us/zoom-meeting-embedded-3.11.0.min.js"></script>
</head>
<body>
  <div id="status-overlay">
    <div id="loading-view">
      <div class="spinner"></div>
      <div id="loading-title" class="status-title">Loading Zoom Strategy Session...</div>
      <div id="loading-sub" class="status-sub">Generating secure SDK token & initializing session...</div>
    </div>
    <div id="error-view" style="display: none;">
      <div id="error-title" class="status-title" style="color: #f87171;">Connection Notice</div>
      <div id="error-message" class="status-sub">Unable to join session.</div>
      <div class="action-row">
        <button class="btn-action" onclick="joinMeeting()">Retry</button>
        <button id="btn-desktop" class="btn-action btn-secondary" onclick="openDesktopApp()">Open in Zoom App</button>
        <button id="btn-web" class="btn-action btn-secondary" onclick="openWebClient()">Join in Browser Tab</button>
      </div>
    </div>
  </div>

  <div id="zoom-meeting-root"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const meetingNumber = urlParams.get('meetingNumber') || '';
    const cleanMeetingNumber = meetingNumber.replace(/[^0-9]/g, '');
    const role = parseInt(urlParams.get('role') || '0', 10);
    const password = urlParams.get('passcode') || urlParams.get('password') || '';
    const userName = urlParams.get('userName') || 'Academy Member';
    const userEmail = urlParams.get('userEmail') || '';

    let client = null;
    let safetyTimer = null;

    function openDesktopApp() {
      if (cleanMeetingNumber) {
        const desktopUrl = `zoommtg://zoom.us/join?confno=${cleanMeetingNumber}${password ? '&pwd=' + encodeURIComponent(password) : ''}`;
        window.open(desktopUrl, '_blank');
      }
    }

    function openWebClient() {
      if (cleanMeetingNumber) {
        const webUrl = `https://zoom.us/wc/${cleanMeetingNumber}/join${password ? '?pwd=' + encodeURIComponent(password) : ''}`;
        window.open(webUrl, '_blank');
      }
    }

    function showErrorState(title, message) {
      if (safetyTimer) clearTimeout(safetyTimer);
      const statusOverlay = document.getElementById('status-overlay');
      const loadingView = document.getElementById('loading-view');
      const errorView = document.getElementById('error-view');
      const errorTitleEl = document.getElementById('error-title');
      const errorMessageEl = document.getElementById('error-message');

      statusOverlay.style.display = 'flex';
      statusOverlay.style.opacity = '1';
      loadingView.style.display = 'none';
      errorView.style.display = 'block';

      errorTitleEl.textContent = title || 'Connection Notice';
      errorMessageEl.textContent = message || 'Unable to join session.';
    }

    async function joinMeeting() {
      const statusOverlay = document.getElementById('status-overlay');
      const loadingView = document.getElementById('loading-view');
      const errorView = document.getElementById('error-view');
      const loadingSubEl = document.getElementById('loading-sub');

      statusOverlay.style.display = 'flex';
      statusOverlay.style.opacity = '1';
      loadingView.style.display = 'block';
      errorView.style.display = 'none';
      loadingSubEl.textContent = 'Generating secure SDK token & initializing session...';

      console.log('[Zoom SDK] Initializing');

      if (!cleanMeetingNumber || cleanMeetingNumber.length < 9) {
        console.warn('[Zoom SDK] Join failed: Invalid meeting number');
        showErrorState('Invalid Meeting Number', 'No valid Zoom meeting number was provided for this session.');
        return;
      }

      // Check browser environment capabilities
      if (typeof window === 'undefined') {
        showErrorState('Unsupported Environment', 'The Zoom Meeting SDK requires a browser environment.');
        return;
      }

      try {
        // 1. Fetch server-generated Meeting SDK signature (JWT)
        const response = await fetch('/api/integrations/zoom/sdk-signature', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ meetingNumber: cleanMeetingNumber, role: role })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${response.status}: Failed to fetch Zoom SDK signature`);
        }

        const { signature, sdkKey } = await response.json();
        console.log('[Zoom SDK] Signature received');

        if (typeof ZoomMtgEmbedded === 'undefined') {
          throw new Error('Zoom Meeting SDK library failed to load from CDN. Please check network connectivity.');
        }

        if (!client) {
          client = ZoomMtgEmbedded.createClient();

          // Register connection and lifecycle events immediately on client instance
          client.on('connection-change', (payload) => {
            const state = payload && payload.state ? payload.state : 'Unknown';
            console.log('[Zoom SDK] Connection state:', state);

            if (state === 'Connected') {
              console.log('[Zoom SDK] Join success');
              if (safetyTimer) clearTimeout(safetyTimer);
              statusOverlay.style.display = 'none';
            } else if (state === 'Closed') {
              console.log('[Zoom SDK] Session closed');
              if (window.parent) {
                window.parent.postMessage({ type: 'ZOOM_LEAVE' }, '*');
              }
            } else if (state === 'Fail') {
              console.warn('[Zoom SDK] Join failed with error code:', payload.errorCode);
              showErrorState(
                'Connection Failed',
                payload.errorCode === 200
                  ? 'Zoom SDK domain authorization error. Please ensure the domain is added to the Zoom Marketplace Domain Allow List.'
                  : `Zoom connection failed (Error Code: ${payload.errorCode || 'unknown'}).`
              );
            }
          });

          client.on('error', (err) => {
            console.warn('[Zoom SDK] Error event received:', err?.type || err);
          });
        }

        const zoomAppRoot = document.getElementById('zoom-meeting-root');

        // 2. Initialize Zoom SDK Component View
        await client.init({
          zoomAppRoot: zoomAppRoot,
          language: 'en-US',
          customize: {
            meetingInfo: [
              'topic', 'host', 'mn', 'pwd', 'telPwd', 'invite', 'participant', 'dc', 'enctype'
            ],
            toolbar: {
              buttons: [
                {
                  text: 'Leave',
                  className: 'LeaveBtn',
                  onClick: () => {
                    try { if (client) client.leaveMeeting(); } catch(e){}
                    if (window.parent) {
                      window.parent.postMessage({ type: 'ZOOM_LEAVE' }, '*');
                    }
                  }
                }
              ]
            }
          }
        });

        console.log('[Zoom SDK] Client initialized');

        // Once the client is initialized, unmask the overlay so Zoom's native UI
        // (such as "Waiting for the host to start this meeting", audio prompts, or waiting room)
        // is directly visible and interactive for the user.
        statusOverlay.style.display = 'none';

        // Set safety timeout guard: if meeting does not establish within 20s, provide fallback
        if (safetyTimer) clearTimeout(safetyTimer);
        safetyTimer = setTimeout(() => {
          // If zoomAppRoot has children (Zoom rendered something), leave it visible
          if (zoomAppRoot && zoomAppRoot.children.length === 0) {
            console.warn('[Zoom SDK] Meeting connection timed out');
            showErrorState(
              'Session Slow to Connect',
              'The Zoom session is taking longer than usual to connect. You can retry or open the session in the Zoom App.'
            );
          }
        }, 20000);

        // 3. Join the meeting
        console.log('[Zoom SDK] Joining meeting');
        const joinResult = await client.join({
          sdkKey: sdkKey,
          signature: signature,
          meetingNumber: cleanMeetingNumber,
          password: password,
          userName: userName,
          userEmail: userEmail
        });

        if (joinResult && joinResult.errorCode && joinResult.errorCode !== 0) {
          console.warn('[Zoom SDK] Join returned error code:', joinResult.errorCode);
          const msg = joinResult.errorMessage || `Zoom error code: ${joinResult.errorCode}`;
          throw new Error(msg);
        }

        console.log('[Zoom SDK] Join request dispatched successfully');
      } catch (err) {
        console.error('[Zoom SDK] Join failed:', err?.message || err);
        const msg = err?.message || 'Error connecting to Zoom session.';
        let userMsg = msg;
        if (msg.includes('domain') || msg.includes('200')) {
          userMsg = 'Zoom SDK domain authorization error. Please verify the domain allow list in your Zoom Marketplace App settings.';
        } else if (msg.includes('Signature') || msg.includes('signature')) {
          userMsg = 'Zoom rejected the Meeting SDK authentication signature. Please verify the SDK Key and Secret configuration.';
        } else if (msg.includes('password') || msg.includes('passcode')) {
          userMsg = 'Incorrect meeting passcode. Please check the meeting details and try again.';
        }
        showErrorState('Unable to Join Session', userMsg);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      joinMeeting();
    });
  </script>
</body>
</html>
